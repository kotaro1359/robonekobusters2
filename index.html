  const n=document.createElement('span');n.className='nm';n.textContent=nm(e);if(e.peer===me){const y=document.createElement('span');y.className='you';y.textContent='あなた';n.appendChild(y)}li.appendChild(n);
  if(e.peer===PJ.hostId)li.insertAdjacentHTML('beforeend',PJCROWN);const s=document.createElement('span');s.className='st'+(busy(e)?' pl':'');s.textContent=busy(e)?'プレイ中':'準備OK';li.appendChild(s);ui.list.appendChild(li);ui.mList.appendChild(li.cloneNode(true))});

 if(all.length<4){const li=document.createElement('li');li.className='empty';li.textContent='あと'+(4-all.length)+'人まで参加できます';ui.list.appendChild(li)}ui.me.textContent='なまえ：'+(NET.myName||'');pjToast()}
function mpUiSync(){if(NETMODE!=='pj'||!PJ.ui)return;const ui=PJ.ui,vis=S==='title'&&!BGM.open;
 if(PJ.open&&S!=='title')pjOpen(0);

/* ---- 負けた時：再戦／やめる の投票 ---- */
function mpVote(i){if(!NET.on||S!=='lose'||NET.vr||!(i===1||i===2))return;const v=i===1?1:2;if(NET.vote===v)return;NET.vote=v;NET.o.snd(v===1?880:520,.12,'triangle',.05,1.2);mpSend(1)}
function mpVoters(){const L=[{n:NET.myName||'あなた',v:NET.vote|0,me:1,slot:NET.slot|0}];for(const r of NET.rp.values())if(!r.gone&&r.seen)L.push({n:mpName(r.id),v:r.vt|0,slot:r.slot});return L}
function mpVoteTick(){if(S!=='lose'){NET.vote=0;NET.vr=0;NET.vrT=0;return}
 if(NET.host&&!NET.vr&&endT>.8){const vs=mpVoters().map(q=>q.v),y=vs.filter(v=>v===1).length,n=vs.filter(v=>v===2).length;if(vs.every(v=>v>0)||endT>40)NET.vr=y>n?1:2}
 if(NET.vr){NET.vrT=(NET.vrT||0)+DT;if(NET.vrT>2){const rt=NET.vr===1,h=NET.host;mpQuit(rt?'再戦！ もう一度いくぞ':'やめることになりました（部屋には残っています）',1);if(rt&&h)NET.autoGo=T+20}}}
function mpVoteDraw(){if(!NET.on||S!=='lose'||endT<=.8)return;const a=Math.min(1,(endT-.8)*4);X.save();X.globalAlpha=a;
 for(const i of[1,2]){const b=LBTN[i];if(NET.vote===i){X.save();X.strokeStyle=i===1?'#7dffb0':'#ffb08a';X.lineWidth=4;X.beginPath();X.roundRect(b[0]-5,b[1]-7,b[2]+10,b[3]+14,17);X.stroke();X.restore();txt('投票済み',b[0]+b[2]/2,b[1]-16,12,i===1?'#9cffc4':'#ffc8b0')}}
 const L=mpVoters(),w=380,x0=W/2-w/2,y0=404,h=34+L.length*24;panel(x0,y0,w,h,12,'rgba(160,200,255,.6)');
 txt(NET.vr?(NET.vr===1?'再戦に決まりました！':'やめることに決まりました'):'みんなで投票（過半数で再戦）',W/2,y0+17,14,NET.vr?(NET.vr===1?'#9cffc4':'#ffc8b0'):'#ffffff');
 L.forEach((q,i)=>{const y=y0+40+i*24,c=MPC[q.slot%4];X.beginPath();X.arc(x0+24,y,6,0,TAU);X.fillStyle=c[2];X.fill();txt(mpShort(q.n,10)+(q.me?'（あなた）':''),x0+38,y,13,'#ffffff','left');
  txt(q.v===1?'再戦':q.v===2?'やめる':'考え中…',x0+w-20,y,13,q.v===1?'#9cffc4':q.v===2?'#ffc8b0':'#aeb9cc','right')});
 if(!NET.vr&&endT>20)txt('あと'+Math.max(0,Math.ceil(40-endT))+'秒で締め切り',W/2,y0+h+14,11,'#c9d6ef');X.restore()}
